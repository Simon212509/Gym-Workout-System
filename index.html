<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Workout System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Header Section -->
        <header>
            <h1 class="title">Gym Workout System</h1>
            <p class="subtitle">Create and manage your workouts, then plan your sessions!</p>
            <div class="cta-buttons">
                <button class="cta-btn">Book Personal Trainer</button>
                <button class="cta-btn">Get Nutrition Advice</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main>
            <!-- Workout Form Section -->
            <section class="workout-form">
                <h2>Add New Workout</h2>
                <form id="workoutForm">
                    <input type="text" id="workoutName" placeholder="Workout Name" required>
                    <textarea id="workoutDescription" placeholder="Workout Description" required></textarea>
                    <input type="file" id="workoutMedia" accept="image/*,video/*">
                    <button type="submit" class="btn">Add Workout</button>
                </form>
            </section>

            <!-- Workout List Section -->
            <section class="workout-list">
                <h2>Your Workouts</h2>
                <ul id="workoutList"></ul>
            </section>

            <!-- Session Plan Section -->
            <section class="session-plan">
                <h2>Create Your Workout Session</h2>
                <ul id="sessionList"></ul>
                <button id="saveSession" class="btn">Save Session Plan</button>
            </section>
        </main>

        <!-- Footer Section -->
        <footer>
            <p>&copy; 2025 Gym Workout System</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
